<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawBench Leaderboard</title>
<style>
  :root {
    --purple-dark: #2d1b4e;
    --purple-mid: #4a2c7a;
    --purple-light: #7c5cbf;
    --lavender: #c4b1e0;
    --lavender-light: #e8dff5;
    --bg: #1a1025;
    --surface: #241838;
    --text: #f0ecf5;
    --text-muted: #a89cc4;
    --accent: #b388ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, var(--lavender), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  .status {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  }

  thead {
    background: var(--purple-mid);
  }

  th {
    padding: 1rem 0.75rem;
    text-align: left;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--lavender-light);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover {
    background: var(--purple-light);
  }

  th .sort-arrow {
    margin-left: 0.3em;
    opacity: 0.4;
  }

  th.sorted-asc .sort-arrow,
  th.sorted-desc .sort-arrow {
    opacity: 1;
  }

  td {
    padding: 0.75rem;
    border-bottom: 1px solid rgba(124, 92, 191, 0.15);
    font-size: 0.95rem;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover {
    background: rgba(124, 92, 191, 0.1);
  }

  .rank {
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    width: 3rem;
  }

  .num {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .quality-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
    margin-right: 0.5em;
    vertical-align: middle;
  }

  footer {
    text-align: center;
    margin-top: 2rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  footer a {
    color: var(--lavender);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>PawBench Leaderboard</h1>
    <p>4-dimensional LLM inference benchmark results</p>
  </header>

  <div id="status" class="status">Loading results...</div>
  <table id="leaderboard" style="display: none;">
    <thead>
      <tr>
        <th data-key="rank">#<span class="sort-arrow"></span></th>
        <th data-key="model">Model<span class="sort-arrow"></span></th>
        <th data-key="gpu">GPU<span class="sort-arrow"></span></th>
        <th data-key="config">Config<span class="sort-arrow"></span></th>
        <th data-key="single_tok_s" data-type="number">Single tok/s<span class="sort-arrow"></span></th>
        <th data-key="peak_tok_s" data-type="number">Peak tok/s<span class="sort-arrow"></span></th>
        <th data-key="avg_quality" data-type="number">Quality<span class="sort-arrow"></span></th>
        <th data-key="avg_ttft_ms" data-type="number">TTFT (ms)<span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>
    <p>
      <a href="https://github.com/zenprocess/pawbench">PawBench</a> &mdash;
      Submit results via pull request to <code>leaderboard/results/</code>
    </p>
  </footer>
</div>

<script>
(function () {
  var rows = [];
  var sortKey = "peak_tok_s";
  var sortAsc = false;

  var RESULTS_PATH = "results/";

  function loadResults() {
    // Try loading the index file listing, or fall back to known files
    // For GitHub Pages, we fetch the results directory listing
    // Since GH Pages doesn't support directory listing, we use a manifest approach:
    // look for results/*.json via the GitHub API or a pre-built manifest
    var statusEl = document.getElementById("status");
    var tableEl = document.getElementById("leaderboard");

    // Try fetching a manifest first (generated by CI), then fall back to example
    fetch(RESULTS_PATH)
      .then(function (resp) {
        if (!resp.ok) throw new Error("no directory listing");
        return resp.text();
      })
      .then(function (html) {
        // Parse links from directory listing (works on simple HTTP servers)
        var re = /href="([^"]+\.json)"/g;
        var files = [];
        var m;
        while ((m = re.exec(html)) !== null) {
          files.push(m[1]);
        }
        if (files.length === 0) throw new Error("no json files found");
        return Promise.all(files.map(function (f) {
          var url = f.startsWith("http") ? f : RESULTS_PATH + f;
          return fetch(url).then(function (r) { return r.json(); });
        }));
      })
      .catch(function () {
        // Fall back: try loading the example submission directly
        return fetch("../example_submission.json")
          .then(function (r) {
            if (!r.ok) throw new Error("no example");
            return r.json();
          })
          .then(function (data) { return [data]; });
      })
      .then(function (results) {
        rows = results.map(function (r) {
          var cfg = r.config || {};
          var configStr = cfg.serving_engine || "?";
          if (cfg.quantization) configStr += " (" + cfg.quantization + ")";
          return {
            model: r.model || "?",
            gpu: r.gpu || "?",
            config: configStr,
            single_tok_s: r.single_tok_s || 0,
            peak_tok_s: r.peak_tok_s || 0,
            avg_quality: r.avg_quality || 0,
            avg_ttft_ms: r.avg_ttft_ms || 0
          };
        });
        statusEl.style.display = "none";
        tableEl.style.display = "";
        renderTable();
      })
      .catch(function (err) {
        statusEl.textContent = "No results available. Submit a benchmark run to get started.";
      });
  }

  function renderTable() {
    // Sort
    rows.sort(function (a, b) {
      var va = a[sortKey], vb = b[sortKey];
      if (typeof va === "string") va = va.toLowerCase();
      if (typeof vb === "string") vb = vb.toLowerCase();
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    var tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      var qualPct = Math.round(r.avg_quality * 100);
      tr.innerHTML =
        '<td class="rank">' + (i + 1) + "</td>" +
        "<td>" + esc(r.model) + "</td>" +
        "<td>" + esc(r.gpu) + "</td>" +
        "<td>" + esc(r.config) + "</td>" +
        '<td class="num">' + r.single_tok_s.toFixed(1) + "</td>" +
        '<td class="num">' + r.peak_tok_s.toFixed(1) + "</td>" +
        '<td class="num"><span class="quality-bar" style="width:' + qualPct + 'px"></span>' + qualPct + "%</td>" +
        '<td class="num">' + Math.round(r.avg_ttft_ms) + "</td>";
      tbody.appendChild(tr);
    });

    // Update sort arrows
    var ths = document.querySelectorAll("th");
    for (var j = 0; j < ths.length; j++) {
      ths[j].className = "";
      var arrow = ths[j].querySelector(".sort-arrow");
      if (arrow) arrow.textContent = "";
      if (ths[j].dataset.key === sortKey) {
        ths[j].className = sortAsc ? "sorted-asc" : "sorted-desc";
        if (arrow) arrow.textContent = sortAsc ? " \u25B2" : " \u25BC";
      }
    }
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // Sortable headers
  document.querySelector("thead").addEventListener("click", function (e) {
    var th = e.target.closest("th");
    if (!th || !th.dataset.key) return;
    var key = th.dataset.key;
    if (key === "rank") return;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = th.dataset.type !== "number"; // strings asc by default, numbers desc
    }
    renderTable();
  });

  loadResults();
})();
</script>
</body>
</html>
